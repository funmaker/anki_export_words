name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .ankiaddon
        run: |
          mkdir -p dist
          zip -r "dist/Export-Words.ankiaddon" . \
            -x "dist/*" \
               ".git/*" \
               ".github/*" \
               "meta.json" \
               ".gitignore" \
               "*.pyc" \
               "*__pycache__*"

      - name: Verify package
        run: unzip -l "dist/Export-Words.ankiaddon"

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Export-Words.ankiaddon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
